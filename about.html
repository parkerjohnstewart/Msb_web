<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maximum Senior Benefits</title>
    <meta name="description" content="" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Source+Sans+3:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="content-config.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body data-page="about">
    <div data-header-root></div>

    <main>
      <section class="hero">
        <div class="container page-grid">
          <div class="lead-block">
            <span class="eyebrow" data-content="about.hero.eyebrow"></span>
            <h1 data-content="about.hero.title"></h1>
            <p data-content="about.hero.body1"></p>
            <p data-content="about.hero.body2"></p>
            <div class="button-row">
              <a class="btn btn-primary" href="contact.html" data-content="about.hero.primary"></a>
              <a class="btn btn-secondary" data-config-href="phoneHref" href="tel:+14793510184" data-content="about.hero.secondary"></a>
            </div>
          </div>
          <div class="page-card">
            <img
              data-config-src="familyImage"
              src="assets/about-family.jpg"
              data-content-alt="about.hero.imageAlt"
              alt=""
            />
          </div>
        </div>
      </section>

      <section class="section surface">
        <div class="container banner">
          <h2 data-content="about.banner.title"></h2>
          <p data-content="about.banner.body"></p>
          <div class="button-row">
            <a class="btn btn-primary" href="contact.html" data-content="about.banner.primary"></a>
          </div>
        </div>
      </section>
    </main>

    <div data-footer-root></div>
  </body>
</html>
